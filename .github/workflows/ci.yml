name: CI - Tests & Syntax Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py download_ffmpeg.py core/version.py core/utils.py core/updater.py core/playlist_extractor.py core/yt_matcher.py core/downloader.py core/tagger.py core/orchestrator.py tests/test_core.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
